---
layout: default
---
<article class="post">
  <a class="back" href="{{ '/blog/' | relative_url }}">← Tous les articles</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%d/%m/%Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <div class="prose">
    {{ content }}
  </div>
</article>

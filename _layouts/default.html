<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="mark">PL</span> Pierre LE QUERE</a>
      <nav>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv/' %} class="on"{% endif %}>Parcours</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} class="on"{% endif %}>Blog</a>
        <a href="{{ '/a-propos/' | relative_url }}"{% if page.url contains '/a-propos/' %} class="on"{% endif %}>À propos</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© {{ 'now' | date: "%Y" }} Pierre LE QUERE</span>
      <span class="footer-links">
        <a href="mailto:{{ site.data.cv.email }}">Email</a>
        {% for l in site.data.cv.liens %}<a href="{{ l.url }}" rel="noopener">{{ l.nom }}</a>{% endfor %}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </span>
    </div>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preload" href="{{ '/assets/fonts/archivo-black.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/bitter.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Pierre Le Quere</a>
      <nav aria-label="Navigation principale">
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv/' %} aria-current="page"{% endif %}>Parcours</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/a-propos/' | relative_url }}"{% if page.url contains '/a-propos/' %} aria-current="page"{% endif %}>À propos</a>
        <button class="theme" type="button" aria-label="Passer en thème clair ou sombre">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="contenu" class="wrap">
    {{ content }}
  </main>

  {% include cartouche.html %}

  <script>
    (function () {
      var root = document.documentElement;
      function isDark() {
        return root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      }
      window.siteTheme = isDark;
      document.querySelector('.theme').addEventListener('click', function () {
        root.dataset.theme = isDark() ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
        var frame = document.querySelector('.utterances-frame');
        if (frame) frame.contentWindow.postMessage({ type: 'set-theme', theme: isDark() ? 'dark-blue' : 'github-light' }, 'https://utteranc.es');
      });
    })();
  </script>
</body>
</html>

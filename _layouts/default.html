<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="mark">PL</span> Pierre LE QUERE</a>
      <nav>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv/' %} class="on"{% endif %}>Parcours</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} class="on"{% endif %}>Blog</a>
        <a href="{{ '/a-propos/' | relative_url }}"{% if page.url contains '/a-propos/' %} class="on"{% endif %}>À propos</a>
        <button class="theme" type="button" aria-label="Changer de thème" title="Clair / sombre">
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© {{ 'now' | date: "%Y" }} Pierre LE QUERE</span>
      <span class="footer-links">
        <a href="mailto:{{ site.data.cv.email }}">Email</a>
        {% for l in site.data.cv.liens %}<a href="{{ l.url }}" rel="noopener">{{ l.nom }}</a>{% endfor %}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </span>
    </div>
  </footer>
  <script>
    document.querySelector('.theme').addEventListener('click', function () {
      var root = document.documentElement;
      var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    });
  </script>
</body>
</html>

---
layout: default
title: Sujets
feuille: Blog
permalink: /blog/tags/
---
<header class="tete">
  <p class="meta"><a href="{{ '/blog/' | relative_url }}">Blog</a></p>
  <h1>Sujets</h1>
</header>

{% for tag in site.tags %}
{% assign tname = tag[0] %}{% assign tposts = tag[1] %}
<section class="bloc" id="{{ tname | slugify }}">
  <h2 class="avec-icone">{% include icon.html tag=tname size="sm" %}{{ tname }}</h2>
  {% include post-list.html posts=tposts limit=1000 %}
</section>
{% endfor %}

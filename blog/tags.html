---
layout: default
title: Sujets
permalink: /blog/tags/
---
<header class="page-head">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">Blog</a></p>
  <h1>Sujets</h1>
</header>

{% for tag in site.tags %}
<section id="{{ tag[0] | slugify }}">
  <h2 class="section-title">{{ tag[0] }}</h2>
  {% assign tposts = tag[1] %}
  {% include post-list.html posts=tposts limit=1000 %}
</section>
{% endfor %}
